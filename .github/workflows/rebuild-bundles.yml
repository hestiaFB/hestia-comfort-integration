name: Rebuild bundles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: better-thermostat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: card
      - run: npm run build
        working-directory: card
      - name: Commit bundles
        run: |
          git config user.name "lepatou"
          git config user.email "97794163+lepatou@users.noreply.github.com"
          git add \
            custom_components/hestia_comfort/frontend/panel.js \
            custom_components/hestia_comfort/frontend/hestia-socle.js \
            custom_components/hestia_comfort/frontend/hestia-comfort-card.js
          git rm -f .github/workflows/rebuild-bundles.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 1
          fi
          git commit -m "Reconstruire le panneau et la carte pour Better Thermostat."
          git push origin HEAD:better-thermostat
